name: apiverve_colorpalette
description: "Color Palette Generator is a color palette API that builds a harmonious color scheme from one HEX base color. Every plan returns each color's HEX code, closest color name, a dark flag and a legible black or white text color; paid plans add RGB, HSL, WCAG contrast checks, CSS variables and a PNG of the palette."
version: 1.2.6
homepage: https://apiverve.com/marketplace/colorpalette?utm_source=dart&utm_medium=referral&utm_content=homepage
repository: https://github.com/apiverve/colorpalette-api/tree/main/dart

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  http: ^1.1.0
  http_parser: ^4.0.0

dev_dependencies:
  lints: ^3.0.0
  test: ^1.24.0
